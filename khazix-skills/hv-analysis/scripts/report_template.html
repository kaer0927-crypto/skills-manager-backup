<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{REPORT_TITLE}}</title>
    <!-- Tailwind CSS with Typography Plugin -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    typography: {
                        DEFAULT: {
                            css: {
                                maxWidth: '100%',
                                color: '#334155',
                                h1: { 
                                    color: '#0f172a', 
                                    borderBottom: '2px solid #e2e8f0', 
                                    paddingBottom: '0.75rem',
                                    marginBottom: '2rem'
                                },
                                h2: { 
                                    color: '#1e293b', 
                                    marginTop: '2.5em',
                                    marginBottom: '1em',
                                    fontWeight: '700'
                                },
                                h3: { 
                                    color: '#334155',
                                    fontWeight: '600'
                                },
                                blockquote: { 
                                    borderLeftColor: '#3b82f6', 
                                    backgroundColor: '#eff6ff', 
                                    padding: '1rem 1.5rem', 
                                    borderRadius: '0.375rem',
                                    fontWeight: '500',
                                    fontStyle: 'normal',
                                    color: '#1d4ed8',
                                    quotes: 'none',
                                    marginTop: '1.5rem',
                                    marginBottom: '1.5rem',
                                    boxShadow: '0 1px 2px 0 rgba(0, 0, 0, 0.05)'
                                },
                                'blockquote p:first-of-type::before': { content: 'none' },
                                'blockquote p:last-of-type::after': { content: 'none' },
                                table: {
                                    fontSize: '0.875rem',
                                    lineHeight: '1.25rem',
                                    width: '100%',
                                    marginTop: '2rem',
                                    marginBottom: '2rem',
                                    borderCollapse: 'collapse',
                                },
                                'thead th': {
                                    backgroundColor: '#f8fafc',
                                    padding: '1rem',
                                    border: '1px solid #e2e8f0',
                                    textAlign: 'left',
                                    color: '#0f172a',
                                    fontWeight: '600'
                                },
                                'tbody td': {
                                    padding: '0.875rem 1rem',
                                    border: '1px solid #e2e8f0',
                                },
                                'tbody tr:nth-child(even)': {
                                    backgroundColor: '#f8fafc',
                                },
                                'tbody tr:hover': {
                                    backgroundColor: '#f1f5f9',
                                },
                                hr: {
                                    borderColor: '#e2e8f0',
                                    marginTop: '3rem',
                                    marginBottom: '3rem'
                                },
                                strong: {
                                    color: '#0f172a',
                                    fontWeight: '700'
                                },
                                a: {
                                    color: '#2563eb',
                                    textDecoration: 'none',
                                    fontWeight: '500',
                                },
                                'a:hover': {
                                    textDecoration: 'underline'
                                }
                            }
                        }
                    }
                }
            }
        }
    </script>
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Noto Sans SC', system-ui, -apple-system, sans-serif; 
            background-color: #f1f5f9; 
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 24px 24px;
        }
        ::selection {
            background-color: #bfdbfe;
            color: #1e3a8a;
        }
    </style>
</head>
<body class="py-8 px-4 sm:px-6 lg:px-8 min-h-screen flex justify-center">
    
    <!-- Main Container -->
    <div class="max-w-5xl w-full bg-white rounded-2xl shadow-xl overflow-hidden ring-1 ring-slate-900/5 my-4 sm:my-8">
        
        <!-- Premium Header Area -->
        <div class="relative bg-gradient-to-br from-slate-900 via-blue-900 to-indigo-900 text-white px-8 py-16 sm:px-16 sm:py-20 text-center overflow-hidden">
            <!-- Decorative Elements -->
            <div class="absolute -top-24 -left-24 w-96 h-96 bg-blue-500/20 rounded-full blur-3xl"></div>
            <div class="absolute -bottom-24 -right-24 w-96 h-96 bg-indigo-500/20 rounded-full blur-3xl"></div>
            <div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCI+CgkJPGNpcmNsZSBjeD0iMSIgY3k9IjEiIHI9IjEiIGZpbGw9InJnYmEoMjU1LDI1NSwyNTUsMC4wNikiLz4KCTwvc3ZnPg==')] opacity-50"></div>
            
            <div class="relative z-10">
                <span class="inline-flex items-center justify-center py-1 px-4 rounded-full bg-white/10 text-blue-100 text-sm font-semibold tracking-widest mb-6 border border-white/20 backdrop-blur-sm">
                    {{HEADER_TAG}}
                </span>
                <h1 class="text-4xl sm:text-5xl md:text-6xl font-black tracking-tight mb-6 leading-tight">
                    {{HERO_TITLE}}
                </h1>
                <p class="text-blue-100 text-lg sm:text-xl max-w-3xl mx-auto font-light leading-relaxed">
                    {{HERO_SUBTITLE}}
                </p>
                
                <div class="mt-10 flex items-center justify-center space-x-6 text-sm text-blue-200/80 font-medium">
                    <div class="flex items-center">
                        <svg class="w-4 h-4 mr-2 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        制作人：{{AUTHOR}}
                    </div>
                    <div>•</div>
                    <div class="flex items-center">
                        <svg class="w-4 h-4 mr-2 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        日期：{{DATE}}
                    </div>
                </div>
            </div>
        </div>

        <!-- Content Area -->
        <article class="p-8 sm:p-12 lg:p-16 relative">
            <div id="content" class="prose prose-slate prose-lg lg:prose-xl mx-auto markdown-body">
                <!-- Content will be injected here during page load -->
                <div class="animate-pulse flex flex-col space-y-4 py-10">
                    <div class="h-8 bg-slate-200 rounded w-3/4"></div>
                    <div class="h-4 bg-slate-200 rounded w-full"></div>
                    <div class="h-4 bg-slate-200 rounded w-full"></div>
                    <div class="h-4 bg-slate-200 rounded w-5/6"></div>
                    <div class="h-8 bg-slate-200 rounded w-1/2 mt-8"></div>
                    <div class="h-4 bg-slate-200 rounded w-full"></div>
                    <div class="h-4 bg-slate-200 rounded w-full"></div>
                </div>
            </div>
        </article>
        
        <!-- Footer Area -->
        <footer class="bg-slate-50 border-t border-slate-200 px-8 py-8 text-center sm:flex sm:items-center sm:justify-between sm:px-12">
            <div class="flex justify-center items-center space-x-2 text-sm text-slate-500 font-medium">
                <svg class="w-5 h-5 text-blue-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
                <span>横纵分析法深度研究</span>
            </div>
            <p class="text-sm text-slate-400 mt-4 sm:mt-0">© {{YEAR}} 本报告由 {{AUTHOR}} 整理制作。仅供内部交流使用。</p>
        </footer>

    </div>

<script type="text/plain" id="markdown-content">
{{MARKDOWN_CONTENT}}
</script>

    <!-- Markdown parsing execution -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Retrieve raw markdown
            const mdElement = document.getElementById('markdown-content');
            let markdownContent = mdElement.textContent || mdElement.innerText;
            
            // Remove the first H1 line (already displayed in hero banner)
            markdownContent = markdownContent.replace(/^# .+\n+/, '');

            // Configure marked.js
            marked.setOptions({
                breaks: true,
                gfm: true
            });
            
            // Render markdown to HTML
            const htmlContent = marked.parse(markdownContent);
            
            // Inject into DOM
            document.getElementById('content').innerHTML = htmlContent;
        });
    </script>
</body>
</html>
