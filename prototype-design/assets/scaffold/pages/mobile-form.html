<!DOCTYPE html>
<!--
  template: mobile/form.html
  用途: 移动端表单页模板（新建/编辑订单 / 客户资料 / 审批申请 等通用表单场景）

  1. 典型场景: 新建订单（默认示例）/ 客户资料 / 审批申请 / 反馈建议
  2. 顶部导航模式: N2' 编辑页 —— 只保留返回 + 标题（取消/保存移到底部）
  3. 底部交互模式: B2' 底部操作栏 —— 取消 + 保存 并排，sticky 黏底
  4. 数据模型（form）：见 setup() 顶部 initialForm() 工厂函数
  5. 字段类型覆盖（≥5 个 van-field）：
       输入框 / 电话 / 选择器触发（readonly + is-link）/ 数字 / 单选组 / 开关 / 文本域
  6. dirty 检测：表单被改动后取消弹二次确认，未改直接返回
  7. 提交 loading：按钮 loading + 防重复点击
  8. 跳转关系（ROUTES）：见 setup() 顶部 ROUTES 注释，集中配置

  PM 改模板最小动作清单：
  1. 改 pageTitle（顶部 nav 标题）
  2. 填 ROUTES 跳转路由表
  3. 改 initialForm() / typeOptions 表单数据与选项
  4. 改 onSubmit() 提交逻辑

  禁忌：
  - 不要在 <div id="app"> 内部写 {{XXX}} 占位符（Vue 插值语法）
  - 不要用 <van-foo ... /> 自闭合（file:// HTML parser bug，列表区会消失）
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="device" content="mobile" />
  <title>表单页</title>
  <link rel="stylesheet" href="../assets/scaffold-base.css" />
  <link rel="stylesheet" href="../assets/vant.css" />
  <script src="../assets/vue.global.prod.js"></script>
  <script src="../assets/vant.min.js"></script>
  <script src="../assets/viewer-bridge.js"></script>
  <style>
    html, body { background: var(--bg-page); -webkit-font-smoothing: antialiased; }
    /* B2' 底部操作栏：取消 + 保存 两个按钮并排，sticky 黏底 */
    .action-bar-bottom {
      position: sticky; bottom: 0; left: 0; right: 0;
      padding: var(--space-2) var(--space-4) calc(var(--space-2) + env(safe-area-inset-bottom));
      background: var(--bg-card); box-shadow: 0 -2px 8px rgba(0,0,0,.04);
      display: flex; gap: var(--space-3); flex-shrink: 0;
    }
    .action-bar-bottom .van-button { flex: 1; }
  </style>
</head>
<body>
  <div id="app" class="is-mobile">
    <div class="page">
      <!-- N2' 编辑页导航：只保留返回 + 标题，取消/保存移到底部 bar -->
      <van-nav-bar
        :title="pageTitle"
        left-arrow
        @click-left="onCancel"></van-nav-bar>

      <!-- 表单字段：8 个 van-field 覆盖全部类型 -->
      <div class="page-scroll">
        <van-field v-model="form.customer" label="客户名称" placeholder="请输入客户名称" maxlength="40" required></van-field>
        <van-field v-model="form.phone" label="联系电话" type="tel" placeholder="11 位手机号" maxlength="11" required></van-field>
        <van-field v-model="form.address" label="收货地址" placeholder="省/市/区/详细地址" maxlength="100"></van-field>

        <van-field name="type" label="订单类型" is-link readonly
          :model-value="form.typeLabel" placeholder="请选择订单类型"
          @click="showTypePicker = true"></van-field>

        <van-field v-model.number="form.amount" label="订单金额" type="digit" placeholder="请输入金额（元）" required>
          <template #button><span style="color:var(--text-secondary)">元</span></template>
        </van-field>

        <van-field v-model.number="form.quantity" label="商品数量" type="digit" placeholder="请输入数量" required>
          <template #button><span style="color:var(--text-secondary)">件</span></template>
        </van-field>

        <van-field name="pay" label="支付方式">
          <template #input>
            <van-radio-group v-model="form.pay" direction="horizontal">
              <van-radio name="wechat">微信</van-radio>
              <van-radio name="alipay">支付宝</van-radio>
              <van-radio name="cod">货到付款</van-radio>
            </van-radio-group>
          </template>
        </van-field>

        <van-field name="urgent" label="加急处理">
          <template #input>
            <van-switch v-model="form.urgent"></van-switch>
          </template>
        </van-field>

        <van-field v-model="form.remark" label="备注" type="textarea" rows="3"
          placeholder="补充说明（选填）" maxlength="200" show-word-limit></van-field>
      </div>

      <!-- B2' 底部操作栏：取消 + 保存 两个按钮 -->
      <div class="action-bar-bottom">
        <van-button plain type="default" @click="onCancel">取消</van-button>
        <van-button type="primary" :loading="submitting" loading-text="保存中..." @click="onSave">保存</van-button>
      </div>

      <!-- 类型选择器：van-action-sheet -->
      <van-action-sheet
        v-model:show="showTypePicker"
        :actions="typeOptions"
        cancel-text="取消"
        @select="onTypeSelect"></van-action-sheet>
    </div>
  </div>

  <script>
    const { createApp, ref, reactive, computed } = Vue;
    const app = createApp({
      setup() {
        /* ========== PM 改模板最小动作清单 ==========
           1. 改 pageTitle
           2. 填 ROUTES
           3. 改 initialForm() / typeOptions
           4. 改 onSubmit() 提交逻辑 */
        const pageTitle = ref('表单页');
        const submitting = ref(false);

        /* ========== 跳转路由表（PM 改成自己业务的 page id）========== */
        const ROUTES = {
          list:    'mobile-list',     // 提交成功后跳列表
          back:    'mobile-list',     // 取消 / 返回
        };

        /* ========== 选择器候选项 ========== */
        const typeOptions = [
          { name: 'type-sale',    label: '销售订单' },
          { name: 'type-return',  label: '退货订单' },
          { name: 'type-exchange',label: '换货订单' },
          { name: 'type-sample',  label: '样品申请' },
        ];
        const showTypePicker = ref(false);

        /* ========== 数据模型（工厂函数：用于 dirty 比较）========== */
        const initialForm = () => ({
          customer: '', phone: '', address: '',
          type: '', typeLabel: '',
          amount: '', quantity: 1,
          pay: 'wechat', urgent: false,
          remark: '',
        });
        const form = reactive(initialForm());

        /* ========== dirty 检测：表单修改后才弹二次确认 ==========
           用 JSON.stringify 比较，PM 新增字段无需改此处。 */
        const isDirty = computed(() => JSON.stringify(form) !== JSON.stringify(initialForm()));

        /* ========== 反馈封装 ========== */
        const toast = {
          ok:  (m) => showToast && showToast({ message: m, type: 'success' }),
          err: (m) => showToast && showToast({ message: m, type: 'fail' }),
        };

        /* ========== 校验 ========== */
        const validate = () => {
          if (!form.customer) { toast.err('请填写客户名称'); return false; }
          if (!form.phone) { toast.err('请填写联系电话'); return false; }
          if (!/^1\d{10}$/.test(form.phone)) { toast.err('手机号格式不正确'); return false; }
          if (!form.type) { toast.err('请选择订单类型'); return false; }
          if (!form.amount) { toast.err('请填写订单金额'); return false; }
          if (!form.quantity || form.quantity < 1) { toast.err('商品数量至少 1 件'); return false; }
          return true;
        };

        /* ========== 交互 ========== */
        const onTypeSelect = (action) => {
          form.type = action.name;
          form.typeLabel = action.label;
          showTypePicker.value = false;
        };

        const onSubmit = () => {
          if (!validate()) return;
          submitting.value = true;
          setTimeout(() => {
            submitting.value = false;
            toast.ok('提交成功');
            setTimeout(() => gotoNode(ROUTES.list), 600);
          }, 800);
        };

        // 取消：dirty 才弹确认
        const onCancel = () => {
          const goBack = () => gotoNode(ROUTES.back, () => history.back());
          if (!isDirty.value) return goBack();
          (showConfirmDialog ? showConfirmDialog({ title: '提示', message: '放弃当前编辑？已填写的内容将丢失。' })
            : Promise.reject())
            .then(goBack)
            .catch(() => {});
        };

        // 保存：等同提交
        const onSave = onSubmit;

        return {
          pageTitle, form, typeOptions, showTypePicker,
          submitting, isDirty, ROUTES,
          onTypeSelect, onSubmit, onSave, onCancel,
        };
      }
    });
    app.use(vant);
    app.mount('#app');
  </script>
</body>
</html>
